[package]
name = "qbdi"
description = "QBDI bindings and native trace API"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
link = ["dep:gum", "dep:flate2", "dep:inject"]

[dependencies]
runtime.workspace = true
libc.workspace = true
thiserror.workspace = true
gum = { workspace = true, optional = true }
flate2 = { version = "1", optional = true, default-features = false, features = ["rust_backend"] }
inject = { workspace = true, optional = true }

[build-dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
