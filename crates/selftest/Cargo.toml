[package]
name = "selftest"
description = "On-device smoke test for the AArch64 inline hook"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# Link the real frida-gum backend; only meaningful on the arm64 device.
device = ["gum/link"]

[[bin]]
name = "selftest"
path = "src/main.rs"
required-features = ["device"]

[dependencies]
gum.workspace = true
libc.workspace = true
runtime.workspace = true
